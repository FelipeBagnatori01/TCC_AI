[project]
name = "tcc-rca"
version = "0.1.0"
description = "Predição e explicação automática de causas raiz de falhas em telecomunicações (LSTM + SHAP/LIME + agente de LLM) no benchmark OpenRCA."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "captum>=0.9.0",
    "drain3>=0.9.11",
    "lightgbm>=4.7.0",
    "lime>=0.2.0.1",
    "matplotlib>=3.11.2",
    "numpy>=1.26",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
    "torch>=2.3",
]

[project.scripts]
tcc-rca = "tcc_rca.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=1.10",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.5",
    "scipy-stubs>=1.17.1.5",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcc_rca"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "C4", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# scikit-learn, drain3, shap, captum and lime ship no type information; only their imports are
# exempted, strict mode stays on.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "drain3", "drain3.*", "shap", "shap.*", "captum", "captum.*", "lime", "lime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
