# Sensitivity control (ADR 0005) for alt_tcn: without the availability exemption, reusing the
# configuration selected by the main run; compared with the E4/E5/E6 control runs.
#   uv run tcc-rca alt-models --config configs/base.yaml [configs/system/bank.yaml] configs/experiment/alt_tcn_sem_isencao.yaml
experiment:
  name: alt_tcn_sem_isencao
series:
  selection:
    constant_exempt_categories: []
alt_models:
  family: tcn
  reuse_selection_from: "reports/tables/alt_models_{system}_alt_tcn.json"
  lstm_name: lstm_sem_isencao
  xai_name: xai_sem_isencao
  baselines_name: baselines_sem_isencao
