# Anthropic, preços de 2026-11-03; escrita em cache = 1,25 x entrada (TTL 5 min).
# Merge AFTER the experiment config: --config configs/base.yaml [bank] <experiment>.yaml configs/llm/claude_sonnet_5_5.yaml
# Needs ANTHROPIC_API_KEY in .env (gitignored).
llm:
  provider: anthropic
  model: claude-sonnet-5-5            # pinned model identifier (R6)
  max_tokens: 16000                  # per call, reasoning included
  effort: medium                     # fixed for the whole study (ADR 0017)
  price_input_per_mtok: 2.0
  price_cached_input_per_mtok: 0.1
  price_cache_write_per_mtok: 2.5
  price_output_per_mtok: 10.0
