# Base configuration. Unknown fields are rejected at load time.
experiment:
  name: e2e
  seed: 42

target_system: Telecom   # Telecom | Bank (Market is out of scope, ADR 0009 addendum)
data_systems: [Telecom, Bank]   # listed in data/MANIFEST.csv
manifest_extra_files: [AppTelecomDeploymentList.xlsx]   # also listed (OpenRCA Drive)

paths:
  data_root: data/raw/openrca
  openrca_repo: external/OpenRCA   # git submodule; commit pinned in ADR 0003
  interim_dir: data/interim
  processed_dir: data/processed
  experiments_dir: experiments
  manifest: data/MANIFEST.csv

llm:
  provider: fake              # swap provider = change this + model (no code change)
  model: fake-model-v1        # pinned model version identifier (R6)
  temperature: 0.0
  max_tokens: 1024
  budget_usd: 1.0             # hard cap per experiment (R7)
  price_input_per_mtok: 1.0   # USD per million input tokens
  price_cached_input_per_mtok: 0.1  # USD per million cache-read input tokens
  price_cache_write_per_mtok: 1.25  # USD per million cache-write input tokens
  price_output_per_mtok: 2.0  # USD per million output tokens (reasoning included)
  long_prompt_threshold_tokens: null  # prompt-length pricing (Haiku 5.5: 100000); null = flat
  long_prompt_price_multiplier: 1.0   # every price times this above the threshold
  effort: null                # reasoning effort; fixed for the whole study once chosen (R6)
  cache_dir: experiments/llm_cache

series:
  step_seconds: 60                 # ADR 0005: modal sampling step of every metric series
  ffill_limit_steps: 5             # forward-fill at most 5 steps inside a day; never across days
  deployment_list: AppTelecomDeploymentList.xlsx   # relative to paths.data_root (OpenRCA Drive)
  kpi_catalog: configs/data/kpi_catalog_telecom.yaml
  selection:
    max_missing_frac: 0.5          # drop features missing in >50% of training rows
    near_constant_mode_share: 0.999  # drop features whose modal value covers >=99.9% of training rows
    # ADR 0005: availability KPIs are constant in normal operation by definition. Control without
    # exemption: configs/experiment/sensitivity_sem_isencao.yaml (threat to validity, see ADR).
    constant_exempt_categories: [disponibilidade]
  report_train_days: 5             # provisional train block (first N days) for the E2 drop report only

tasks:
  # ADR 0008: unlabelled near-copies of 2020_05_31, 2020_05_23 and 2020_05_25 (leakage).
  excluded_days: ["2020_04_21", "2020_04_22", "2020_04_23"]
  first_test_day: "2020_05_22"      # 2020_04_11 + 2020_04_20 form the initial train/validation block
  val_days: 1                      # the last day before each test day is that fold's validation
  window_minutes: 20               # W (ADR 0007): below the 30 min minimum gap between onsets
  horizon_minutes: 0               # H (ADR 0007): set from the precursor measurement
  detection_tolerance_minutes: 5   # D (ADR 0007)
  normal_margin_before_minutes: 5  # LSTM normal mask excludes windows touching
  normal_margin_after_minutes: 30  # [onset - before, onset + after]; no failure end is labelled
  precursor:
    leads_minutes: [15, 10, 5, 2, 1, 0, -1, -2, -5]
    top_k: 10
    local_window_minutes: 60         # ADR 0013: causal local baseline (robust to drift across days)
    local_cap: 50.0
    bootstrap: 2000

baselines:                         # E4 (ADR 0010)
  zscore_threshold: 3.0            # fixed 3-sigma rule; a validation-tuned variant is also reported
  isolation_forest_estimators: 200
  lightgbm:                        # fixed, small: fold 0 has no validation failure to tune on
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 5
    colsample_bytree: 0.2
  val_fallback_quantile: 0.99      # threshold when the validation day has no failure (fold 0)
  event_lookback_minutes: 5        # = normal margin before the onset
  event_max_delay_minutes: 30      # = normal margin after the onset
  bootstrap: 2000
  bootstrap_block_minutes: 30

lstm:                              # E5 (ADR 0015); CPU, deterministic
  seeds: [0, 1, 2, 3, 4]           # final configuration: 5 seeds per fold
  forecaster_grid:                 # search budget: 8 configurations x folds, 1 seed
    hidden: [64, 128]
    layers: [1, 2]
    normalization: [global, local]
  classifier_hidden: [64, 128]     # classifier search: 2 configurations; its normalization
  classifier_layers: [1]           # is the one selected for the forecaster
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 128
  max_epochs: 30
  patience: 5
  global_clip: 10.0
  score_top_k: 10
  reuse_selection_from: null

explain:                           # E6 (ADR 0016); explains the E5 models, no training
  lstm_name: lstm                  # reports/tables/lstm_<system>_<lstm_name>.json -> run with the models
  device: cpu                      # cpu | mps (Apple GPU; not bit-reproducible, see ADR 0016)
  explained_seed: 0
  stability_seeds: [1, 2, 3, 4]
  background_windows: 100          # SHAP GradientExplainer background: normal training windows
  shap_samples: 200
  lime_samples: 3000
  lime_kernel_width: 25.0          # LIME default for text (cosine distance x 100)
  ig_steps: 32
  ig_windows_per_fold: 3           # Integrated Gradients cross-check on a sample of windows
  top_k: 10
  deletion_steps: [1, 2, 5, 10, 20, 50]
  random_orders: 5
  evidence_detector: lstm_classifier  # picks the evidence window, gives score/alarm (E5 best detector)
  evidence_explained: lstm_forecast  # cited attributions: stable across seeds (ADR 0016, post-test)
  evidence_top_components: 5
  evidence_top_kpis: 10
  # Reason -> KPI categories that count as a correct suggested category. Fixed BEFORE measuring
  # (2026-11-12) from the reason names only.
  reason_categories:
    Telecom:
      CPU fault: [CPU]
      network delay: [rede, latência]
      network loss: [rede, erro]
      db close: [banco de dados, disponibilidade]
      db connection limit: [banco de dados, carga]
    Bank:
      high CPU usage: [CPU]
      high JVM CPU load: [CPU]
      high memory usage: [memória]
      JVM Out of Memory (OOM) Heap: [memória]
      high disk I/O read usage: [disco]
      high disk space usage: [disco]
      network latency: [rede, latência]
      network packet loss: [rede, erro]

alt_models:                        # alternative explainable models vs. the LSTM (ADR 0018)
  family: tabular                  # tabular (LightGBM, Isolation Forest, logistic) | tcn
  normalization: [global, local]   # searched, as for the LSTM
  lightgbm_num_leaves: [15, 31]    # 2 x 2 x 2 normalizations = 8 configurations per model
  lightgbm_estimators: [300, 600]
  iforest_estimators: [100, 300]
  iforest_max_samples: [256, 1024]
  logistic_c: [0.01, 0.1, 1.0, 10.0]
  logistic_max_iter: 200
  tcn_channels: [32, 64]
  tcn_blocks: [2, 3]
  tcn_kernel: 3
  lstm_name: lstm                  # E5 run compared against (detection, same seeds)
  xai_name: xai                    # E6 run compared against (XAI localization)
  baselines_name: baselines        # E4 run compared against (heuristic localization)
  reuse_selection_from: null
  max_folds: null

agent:                             # E7 (ADR 0017); model/effort/budget are in llm
  variant: A3                      # A1 telemetry only | A2 + LSTM score/native ranking | A3 + SHAP/LIME
  case_set: test                   # test (45 Telecom / 120 Bank) | pilot (queries before the first test day)
  repetitions: 1                   # independent samples per case (variance; no temperature on current models)
  limit: null
  max_tool_calls: 20               # per case, same in every variant
  max_turns: 30
  max_retries: 2                   # invalid answers sent back with the validation errors
  anomaly_top_k: 15
  evidence_name: xai               # E6 evidence packages: data/processed/<system>/evidence/<name>/
  prompts_dir: configs/prompts
